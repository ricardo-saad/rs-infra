name: Reusable · Terraform plan

on:
  workflow_call:
    inputs:
      stack:
        description: Terraform stack name.
        required: true
        type: string
      state_key:
        description: Exact S3 state object key.
        required: true
        type: string
    secrets:
      TFVARS_CONTENT:
        description: Complete HCL tfvars for the selected stack.
        required: true
      CLOUDFLARE_API_TOKEN:
        description: Optional read-only Cloudflare token for DNS plans.
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Reviewed plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      TERRAFORM_VERSION: "1.15.8"
      STACK: ${{ inputs.stack }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      STATE_KEY: ${{ inputs.state_key }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ID: ${{ vars.TF_STATE_KMS_KEY_ID }}
      TF_PLAN_BUCKET: ${{ vars.TF_PLAN_BUCKET }}
      TF_PLAN_KMS_KEY_ID: ${{ vars.TF_PLAN_KMS_KEY_ID }}
      TRUSTED_WORKFLOW_REF: ${{ format('{0}/.github/workflows/_reusable-terraform-plan.yml@{1}', github.repository, github.ref) }}
    steps:
      - name: Check out reviewed merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Assume plan role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          role-session-name: gha-${{ inputs.stack }}-plan
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Produce private reviewed plan
        id: plan
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TFVARS_CONTENT: ${{ secrets.TFVARS_CONTENT }}
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_EVENT_PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/terraform-plan.sh

      - name: Publish sanitized plan summary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_STATUS: ${{ steps.plan.outputs.status }}
          PLAN_CREATES: ${{ steps.plan.outputs.creates }}
          PLAN_UPDATES: ${{ steps.plan.outputs.updates }}
          PLAN_DELETES: ${{ steps.plan.outputs.deletes }}
          PLAN_REPLACEMENTS: ${{ steps.plan.outputs.replacements }}
          PLAN_DIGEST: ${{ steps.plan.outputs.bundle_sha256 }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$(printf '%s\n' \
            "### Terraform ${STACK} plan" \
            '' \
            "- Status: ${PLAN_STATUS}" \
            "- Creates: ${PLAN_CREATES}" \
            "- Updates: ${PLAN_UPDATES}" \
            "- Deletes: ${PLAN_DELETES}" \
            "- Replacements: ${PLAN_REPLACEMENTS}" \
            "- Private plan digest: \`${PLAN_DIGEST}\`" \
            '' \
            'The complete plan is encrypted in the private plan bucket.')"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
