name: Static validation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: static-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.15.8"

jobs:
  repository:
    name: Repository scaffold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate repository configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .terraform-version)" = "${TERRAFORM_VERSION}"
          jq --exit-status empty renovate.json

          required_readmes=(
            argocd/bootstrap/README.md
            images/home/README.md
            provisioner/README.md
            tools/secret/README.md
            tools/talos-seed/README.md
          )
          for readme in "${required_readmes[@]}"; do
            test -s "${readme}"
          done

          python3 - <<'PY'
          import pathlib
          import re
          import sys

          invalid = []
          external = re.compile(r"^[^@\s]+@[0-9a-f]{40}(?:\s+#.*)?$")
          for path in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              for number, line in enumerate(path.read_text().splitlines(), 1):
                  stripped = line.strip()
                  if not stripped.startswith("uses:"):
                      continue
                  value = stripped.removeprefix("uses:").strip()
                  if value.startswith("./"):
                      continue
                  if not external.fullmatch(value):
                      invalid.append(f"{path}:{number}:{value}")

          if invalid:
              print("GitHub Actions must use full commit SHAs:", file=sys.stderr)
              print("\n".join(invalid), file=sys.stderr)
              raise SystemExit(1)
          PY

          if rg --files-with-matches 'aws-actions/configure-aws-credentials@' \
            .github/workflows |
            rg -v '/_reusable-'; then
            echo "AWS credential steps must live only in trusted reusable workflows." >&2
            exit 1
          fi

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Lint workflows
        uses: reviewdog/action-actionlint@50842263c20a7c46bd0065b9e624d3c569db061e # v1.73.0
        with:
          fail_level: any
          filter_mode: nofilter
          reporter: local

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_VERSION: "8.28.0"

  terraform:
    name: Terraform static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        shell: bash
        run: terraform fmt -check -diff -recursive terraform

      - name: Validate each stack without a backend
        shell: bash
        run: |
          set -euo pipefail
          found=false
          while IFS= read -r stack; do
            found=true
            terraform -chdir="${stack}" init -backend=false -input=false
            terraform -chdir="${stack}" validate -no-color
          done < <(find terraform -mindepth 1 -maxdepth 1 -type d \
            -exec sh -c 'test -n "$(find "$1" -maxdepth 1 -name "*.tf" -print -quit)"' sh {} \; \
            -print | sort)
          if [[ "${found}" != "true" ]]; then
            echo "No Terraform stacks found." >&2
            exit 1
          fi

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        with:
          tflint_version: v0.64.0
          tflint_wrapper: false

      - name: Lint each stack
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r stack; do
            tflint --chdir="${stack}" --format=compact
          done < <(find terraform -mindepth 1 -maxdepth 1 -type d \
            -exec sh -c 'test -n "$(find "$1" -maxdepth 1 -name "*.tf" -print -quit)"' sh {} \; \
            -print | sort)

  terraform-docs:
    name: Terraform documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Deliberately a separate job: fail-on-diff inspects the whole working
      # tree, and `terraform init` in the Terraform job writes an untracked
      # .terraform.lock.hcl into every stack. Sharing a job makes this step
      # report uncommitted changes even when every README is byte-identical.
      - name: Check generated Terraform documentation
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          fail-on-diff: "true"
          find-dir: terraform
          git-push: "false"
          indention: "2"
          output-file: README.md
          output-method: inject

  configuration-security:
    name: Trivy configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Scan configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: "false"
          exit-code: "1"
          format: table
          hide-progress: "true"
          scan-ref: .
          scan-type: config
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          version: v0.72.0
