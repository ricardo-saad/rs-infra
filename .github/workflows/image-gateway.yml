name: Image · Gateway

on:
  pull_request:
    branches: [main]
    paths:
      - images/gateway/**
      - .github/workflows/image-gateway.yml

permissions:
  contents: read

concurrency:
  group: image-gateway-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  PACKER_AMAZON_PLUGIN_VERSION: ${{ vars.PACKER_AMAZON_PLUGIN_VERSION }}
  RS_GATEWAY_PACKER_VERSION: ${{ vars.RS_GATEWAY_PACKER_VERSION }}
  RS_GATEWAY_SESSION_MANAGER_PLUGIN_VERSION: ${{ vars.RS_GATEWAY_SESSION_MANAGER_PLUGIN_VERSION }}
  RS_GATEWAY_SESSION_MANAGER_PLUGIN_SHA256: ${{ vars.RS_GATEWAY_SESSION_MANAGER_PLUGIN_SHA256 }}
  RS_GATEWAY_SOURCE_AMI: ${{ vars.RS_GATEWAY_SOURCE_AMI }}
  RS_GATEWAY_SOURCE_AMI_OWNER: ${{ vars.RS_GATEWAY_SOURCE_AMI_OWNER }}
  RS_GATEWAY_BUILD_SUBNET_ID: ${{ vars.IMAGE_BUILD_SUBNET_ID }}
  RS_GATEWAY_BUILDER_INSTANCE_PROFILE: ${{ vars.IMAGE_BUILDER_INSTANCE_PROFILE }}
  RS_GATEWAY_ROOT_VOLUME_SIZE: ${{ vars.RS_GATEWAY_ROOT_VOLUME_SIZE }}
  RS_GATEWAY_WIREGUARD_VERSION: ${{ vars.RS_GATEWAY_WIREGUARD_VERSION }}
  RS_GATEWAY_NFTABLES_VERSION: ${{ vars.RS_GATEWAY_NFTABLES_VERSION }}
  RS_GATEWAY_APT_REPOSITORY: ${{ vars.RS_GATEWAY_APT_REPOSITORY }}
  RS_GATEWAY_ADGUARD_ARCHIVE_URL: ${{ vars.RS_GATEWAY_ADGUARD_ARCHIVE_URL }}
  RS_GATEWAY_ADGUARD_ARCHIVE_SHA256: ${{ vars.RS_GATEWAY_ADGUARD_ARCHIVE_SHA256 }}
  RS_GATEWAY_ADGUARD_SCHEMA_VERSION: ${{ vars.RS_GATEWAY_ADGUARD_SCHEMA_VERSION }}
  RS_GATEWAY_ADGUARD_UPSTREAM_DNS: ${{ vars.RS_GATEWAY_ADGUARD_UPSTREAM_DNS }}
  RS_GATEWAY_ADGUARD_FILTER_NAME: ${{ vars.RS_GATEWAY_ADGUARD_FILTER_NAME }}
  RS_GATEWAY_ADGUARD_FILTER_URL: ${{ vars.RS_GATEWAY_ADGUARD_FILTER_URL }}
  RS_GATEWAY_AWSCLI_VERSION: ${{ vars.RS_GATEWAY_AWSCLI_VERSION }}
  RS_GATEWAY_APACHE2_UTILS_VERSION: ${{ vars.RS_GATEWAY_APACHE2_UTILS_VERSION }}
  RS_GATEWAY_CURL_VERSION: ${{ vars.RS_GATEWAY_CURL_VERSION }}
  RS_GATEWAY_CA_CERTIFICATES_VERSION: ${{ vars.RS_GATEWAY_CA_CERTIFICATES_VERSION }}
  RS_GATEWAY_PYTHON3_VERSION: ${{ vars.RS_GATEWAY_PYTHON3_VERSION }}
  RS_GATEWAY_SSM_AGENT_REVISION: ${{ vars.RS_GATEWAY_SSM_AGENT_REVISION }}

jobs:
  untrusted-fork:
    name: Fork safety
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep fork pull requests credential-free
        shell: bash
        run: echo "AMI builds are skipped for untrusted forks; static validation still runs."

  build:
    name: Build reviewed AMI
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Check out reviewed merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: ${{ env.RS_GATEWAY_PACKER_VERSION }}

      - name: Install pinned Session Manager plugin
        shell: bash
        run: |
          set -euo pipefail
          package="${RUNNER_TEMP}/session-manager-plugin.deb"
          curl --fail --silent --show-error --location \
            --proto '=https' --tlsv1.2 \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/${RS_GATEWAY_SESSION_MANAGER_PLUGIN_VERSION}/ubuntu_64bit/session-manager-plugin.deb" \
            --output "${package}"
          printf '%s  %s\n' \
            "${RS_GATEWAY_SESSION_MANAGER_PLUGIN_SHA256}" "${package}" |
            sha256sum --check --strict
          sudo dpkg --install "${package}"
          test "$(session-manager-plugin --version)" = \
            "${RS_GATEWAY_SESSION_MANAGER_PLUGIN_VERSION}"

      - name: Check image sources
        shell: bash
        run: |
          set -euo pipefail
          packer fmt -check -diff images/gateway/gateway.pkr.hcl
          find images/gateway -type f -name '*.sh' -print0 |
            xargs -0 -r -n 20 sh -n
          python3 -m unittest discover -s images/gateway/tests -v

      - name: Assume image-build role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.IMAGE_BUILD_ROLE_ARN }}
          role-session-name: gha-gateway-image-pr-${{ github.event.pull_request.number }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Build gateway AMI
        id: build
        shell: bash
        working-directory: images/gateway
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          short_sha="${PR_HEAD_SHA:0:12}"
          export RS_GATEWAY_BUILD_VERSION="pr-${PR_NUMBER}-${short_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ./scripts/build.sh

          artifact_id="$(jq -r '.builds[-1].artifact_id' packer-manifest.json)"
          ami_id="${artifact_id##*:}"
          if [[ ! "${ami_id}" =~ ^ami-[0-9a-f]+$ ]]; then
            echo "Packer manifest did not contain an AMI ID" >&2
            exit 2
          fi
          {
            echo "ami_id=${ami_id}"
            echo "build_version=${RS_GATEWAY_BUILD_VERSION}"
          } >>"${GITHUB_OUTPUT}"

      - name: Upload immutable build manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-ami-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: images/gateway/packer-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish AMI summary
        shell: bash
        env:
          AMI_ID: ${{ steps.build.outputs.ami_id }}
          BUILD_VERSION: ${{ steps.build.outputs.build_version }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$(printf '%s\n' \
            '### Gateway AMI build' \
            '' \
            "- AMI: \`${AMI_ID}\`" \
            "- Build version: \`${BUILD_VERSION}\`" \
            "- Reviewed merge: \`${GITHUB_SHA}\`" \
            '' \
            'The Packer manifest is attached to this workflow run.')"
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
