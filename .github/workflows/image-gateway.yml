name: Image · Gateway

on:
  pull_request:
    branches: [main]
    paths:
      - images/gateway/**
      - .github/workflows/_reusable-image-gateway-build.yml
      - .github/workflows/image-gateway.yml

permissions:
  contents: read

concurrency:
  group: image-gateway-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  untrusted-fork:
    name: Fork safety
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep fork pull requests credential-free
        shell: bash
        run: echo "AMI builds are skipped for untrusted forks; static validation still runs."

  build:
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.IMAGE_GATEWAY_CI_ENABLED == 'true'
    uses: ./.github/workflows/_reusable-image-gateway-build.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
