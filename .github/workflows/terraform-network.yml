name: Terraform · Network

on:
  pull_request:
    branches: [main]
    paths:
      - terraform/network/**
      - .github/scripts/terraform-plan.sh
      - .github/scripts/terraform-apply.sh
      - .github/workflows/_reusable-terraform-plan.yml
      - .github/workflows/_reusable-terraform-apply.yml
      - .github/workflows/terraform-network.yml
  push:
    branches: [main]
    paths:
      - terraform/network/**
      - .github/scripts/terraform-plan.sh
      - .github/scripts/terraform-apply.sh
      - .github/workflows/_reusable-terraform-plan.yml
      - .github/workflows/_reusable-terraform-apply.yml
      - .github/workflows/terraform-network.yml

permissions:
  contents: read

concurrency:
  group: terraform-network-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'apply' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  untrusted-fork:
    name: Fork safety
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Keep fork pull requests credential-free
        shell: bash
        run: echo "Cloud planning is skipped for untrusted forks; static validation still runs."

  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.TF_NETWORK_CI_ENABLED == 'true'
    uses: ./.github/workflows/_reusable-terraform-plan.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      stack: network
      state_key: ${{ vars.TF_NETWORK_STATE_KEY }}
    secrets:
      TFVARS_CONTENT: ${{ secrets.TF_NETWORK_VARS }}

  apply:
    if: github.event_name == 'push' && vars.TF_NETWORK_CI_ENABLED == 'true'
    uses: ./.github/workflows/_reusable-terraform-apply.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    with:
      stack: network
      state_key: ${{ vars.TF_NETWORK_STATE_KEY }}
