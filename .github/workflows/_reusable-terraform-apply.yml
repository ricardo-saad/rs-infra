name: Reusable · Terraform apply

on:
  workflow_call:
    inputs:
      stack:
        description: Terraform stack name.
        required: true
        type: string
      state_key:
        description: Exact S3 state object key.
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    name: Apply reviewed plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: apply
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      TERRAFORM_VERSION: "1.15.8"
      STACK: ${{ inputs.stack }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      STATE_KEY: ${{ inputs.state_key }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KMS_KEY_ID: ${{ vars.TF_STATE_KMS_KEY_ID }}
      TF_PLAN_BUCKET: ${{ vars.TF_PLAN_BUCKET }}
      TF_PLAN_KMS_KEY_ID: ${{ vars.TF_PLAN_KMS_KEY_ID }}
    steps:
      - name: Check out merged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Assume apply role
        uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          role-session-name: gha-${{ inputs.stack }}-apply
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true

      - name: Apply exact reviewed plan
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/terraform-apply.sh
